# Research configuration for tokenchurn project analysis
# Each repo is cloned to tmp/<name> and analyzed.
# Reports are written to docs/research/<name>/

prompt: |
  We are building tokenchurn — a multi-model, multi-provider coding harness
  focused on token economics (max output quality per dollar).

  Analyze this codebase and extract anything useful for tokenchurn:
  1. Architecture patterns — how does it structure multi-model orchestration?
  2. Provider abstraction — how does it handle multiple LLM backends?
  3. Cost/routing logic — any token budgeting, cost tracking, or model selection?
  4. Context management — how does it manage workspace/project context?
  5. Interesting features — anything unique or clever worth stealing?
  6. Code quality — testing patterns, packaging, CLI design.

  Be specific: mention file paths, function names, design decisions.
  This is research — we want to borrow the best ideas.

repos:
  # ─── Multi-Model Debate & Blueprints ───
  - url: https://github.com/karpathy/llm-council
    name: llm-council
    create_zip: true
    analysis_commands:
      - "tree {repo_dir} -L 2 --dirsfirst > {report_dir}/tree.txt"

  - url: https://github.com/karpathy/autoresearch
    name: autoresearch
    create_zip: true
    analysis_commands:
      - "tree {repo_dir} -L 2 --dirsfirst > {report_dir}/tree.txt"

